<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation Map</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="title" class="box">AUTOMATION MAP<span id="subtitle"></span></div>
  <div id="crosshair">+</div>
  <div id="target" class="box hidden"></div>
  <div id="totals" class="box"></div>
  <div id="help" class="box">WASD MOVE · MOUSE LOOK · CLICK GRAB · WHEEL PULL · F READ · C OVERVIEW · P PHOTO</div>
  <div id="error" class="box hidden"></div>
</div>

<div id="overlay">
  <div class="box">
    <h1>AUTOMATION MAP</h1>
    <p>CLICK TO ENTER</p>
    <p class="small">ESC releases the mouse · C overview · P saves a 1600×1200 PNG</p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
